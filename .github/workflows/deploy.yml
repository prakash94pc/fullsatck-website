# Folder create
New-Item -ItemType Directory -Path ".github\workflows" -Force

# File create
@'
name: Deploy to EC2

on:
  push:
    branches:
    - main
    - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH key
      run: |
        echo "${{ secrets.EC2_SSH_KEY }}" > private-key.pem
        chmod 600 private-key.pem
    
    - name: Deploy to EC2
      run: |
        scp -o StrictHostKeyChecking=no -i private-key.pem -r ./* ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/portfolio/
        
        ssh -o StrictHostKeyChecking=no -i private-key.pem ubuntu@${{ secrets.EC2_HOST }} << 'SSH'
          sudo cp -r /home/ubuntu/portfolio/* /var/www/html/
          sudo systemctl restart nginx
          echo "✅ Deployment complete at $(date)"
        SSH
    
    - name: Cleanup
      run: rm -f private-key.pem
'@ | Out-File -FilePath ".github\workflows\deploy.yml" -Encoding UTF8
